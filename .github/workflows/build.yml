name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/PojavLauncher
          path: pojav
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Export sources
        run: cd pojav/app_pojavlauncher/src/main && zip -r $GITHUB_WORKSPACE/screens.zip res/values java/com/kdt/mcgui AndroidManifest.xml || true
      - name: Apply theme
        run: |
          unzip -o overlay.zip -d overlay
          cp -r overlay/res/. pojav/app_pojavlauncher/src/main/res/
          python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow || true
          python3 overlay/wenera_theme.py pojav/app_pojavlauncher/src/main/res
      - name: Build
        working-directory: pojav
        run: ./gradlew :app_pojavlauncher:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens.zip
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: wenera-launcher-apk
          path: pojav/app_pojavlauncher/build/outputs/apk/debug/*.apk
